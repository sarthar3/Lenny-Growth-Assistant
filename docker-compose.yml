services:
  db:
    image: postgres:16-alpine
    container_name: lenny_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lenny_growth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_growth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lenny_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/lenny_growth_db
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TRANSCRIPT_DIR=/app/data/transcripts_repo/episodes
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lenny_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny_react_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - lenny_net

volumes:
  postgres_data:

networks:
  lenny_net:
    driver: bridge
